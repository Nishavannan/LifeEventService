spring.application.name=life-event-service
spring.kafka.bootstrap-servers=localhost:9092

#consumer vonfig

spring.kafka.consumer.group-id=life-event-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.conumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.levis.life_event_service.dto

#producer configuration

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.conumer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer